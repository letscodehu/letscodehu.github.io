<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Only page-independent tags belong here. Everything that varies per route or
      language — title, description, canonical, hreflang, og:title/description/image,
      JSON-LD — is set by useHead() in AppLayout.vue and baked in per page by
      vite-ssg. Duplicating any of it here would ship two conflicting values.

      theme-color follows the system preference, which is also the site's default.
      A visitor who flips the in-page toggle keeps the browser chrome of their
      system theme; there is no static-markup way to follow a runtime class.
    -->
    <meta property="og:site_name" content="Letscode Solutions Kft" />
    <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#04050a" media="(prefers-color-scheme: dark)" />

    <!-- Replaced per page by useHead(); this is the pre-hydration fallback only. -->
    <title>Letscode Solutions Kft</title>
    <script>
      (function () {
        var STORAGE_KEY = 'dark-mode-preference'
        var COOKIE_KEY = 'dark-mode-preference'
        var LIGHT_CLASS = 'theme-light'
        var DARK_CLASS = 'theme-dark'
        var html = document.documentElement

        function readStored() {
          try {
            return localStorage.getItem(STORAGE_KEY)
          } catch (error) {
            return null
          }
        }

        function readCookie() {
          var match = document.cookie.match(
            new RegExp('(?:^|;\\s*)' + COOKIE_KEY + '=(dark|light)(?:;|$)')
          )
          return match ? match[1] : null
        }

        function detectSystem() {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }

        function applyTheme(theme) {
          html.classList.remove(LIGHT_CLASS, DARK_CLASS)
          html.classList.add(theme === 'dark' ? DARK_CLASS : LIGHT_CLASS)
          html.dataset.theme = theme
        }

        var stored = readStored() || readCookie()
        if (stored !== 'dark' && stored !== 'light') {
          stored = detectSystem()
        }
        applyTheme(stored)
      })()
    </script>
  </head>
  <body>
    <div id="app" contenteditable="false"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- 100% privacy-first analytics -->
<script data-collect-dnt="true" async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
<noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif?collect-dnt=true" alt="" referrerpolicy="no-referrer-when-downgrade"/></noscript>
  </body>
</html>
